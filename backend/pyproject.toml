[project]
name = "pnt1"
version = "2.5.0"
description = "PNT1 Logistics Network Digital Twin - V2 command center"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "networkx>=3.3",
    "ortools>=9.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "certifi>=2024.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pnt1"]
